<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="숏츠와 릴스에서 소개한 상품을 번호로 찾아보세요. 상품 정보와 쿠팡 구매 링크를 모았습니다.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Partners Shorts · 영상 속 상품</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#catalog">상품 목록으로 이동</a>
  <div class="page">
    <header class="masthead"><a class="wordmark" href="./">Partners Shorts<span>영상 속 상품 모음</span></a><a class="top-link" href="#search">상품 찾기 ↗</a></header>
    <main>
      <section class="intro" aria-labelledby="title">
        <h1 id="title">영상 속 그 상품.</h1>
        <p>숏츠와 릴스에서 본 번호로 찾아보세요.<br>상품 정보와 구매 링크를 한곳에 모았습니다.</p>
      </section>
      <section id="catalog" aria-label="상품 목록">
        <div class="find-bar"><div class="search-field"><label for="search">영상에서 본 번호나 상품명</label><div class="search-box"><input id="search" type="search" placeholder="예: 23, 수납" autocomplete="off"><button type="button" id="clear" aria-label="검색어 지우기" hidden>지우기</button></div></div><label class="category-field" for="category">카테고리<select id="category"><option value="">전체</option></select></label></div>
        <div class="result-bar"><h2>소개한 상품</h2><p id="count" aria-live="polite">불러오는 중…</p></div>
        <div id="products" class="products" aria-busy="true"></div>
        <div id="state" class="empty" role="status"><h3>상품 목록을 불러옵니다.</h3><p>잠시만 기다려 주세요.</p></div>
        <button id="retry" type="button" hidden>다시 불러오기</button>
        <noscript><p>상품을 검색하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
      </section>
    </main>
    <footer>
      <p>상품의 현재 가격과 재고는 쿠팡에서 확인해 주세요.<br>구매·결제·배송은 쿠팡에서 진행됩니다.</p><a href="#search">상품 찾기 ↑</a>
      <aside class="disclosure" aria-label="제휴 고지"><strong>제휴 안내</strong><p id="disclosure">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p></aside>
    </footer>
  </div>
</body>
</html>
